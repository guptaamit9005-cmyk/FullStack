
<!DOCTYPE html>
<html>
<head>
<style>

.box {
    width: 200px;
    height: 200px;
    background-color: red;

    animation: colorChange 5s infinite;
}

/* Animation */
@keyframes colorChange {

    0% {
        background-color: red;
    }

    25% {
        background-color: yellow;
    }

    50% {
        background-color: blue;
    }

    75% {
        background-color: green;
    }

    100% {
        background-color: red;
    }

}

</style>
</head>
<body>

<div class="box"></div>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
<style>

.box {
    width: 250px;
    height: 250px;
    background-color: red;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    font-size: 35px;
    font-weight: bold;

    animation: colorChange 5s infinite;
}

@keyframes colorChange {

    0% {
        background-color: red;
    }

    25% {
        background-color: yellow;
    }

    50% {
        background-color: blue;
    }

    75% {
        background-color: green;
    }

    100% {
        background-color: red;
    }

}

</style>
</head>
<body>

<div class="box">
    AMIT
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2 {
            position: absolute;
            left: 150px;
            top: 150px;
        }
    </style>
</head>

<body>
    <h1>The position property</h1>

    <h2>This is a heading with a absolute position</h2>
    <p>With absolute postioning, an element can be placed anywhere on a page. The heading below is placed 100px from the left of the page and 150px fromm the top  of the page.
    </p>
</body>
</html>
